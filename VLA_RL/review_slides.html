<h2 id="what-the-bandit-converged-to--the-de-facto-ablation">What the bandit converged to — the de-facto ablation</h2>
<p>With no formal ablations in the paper, <strong>where the posteriors settled is the strongest evidence available</strong> about which design choices carry signal.</p>
<div class="box good">
<ul>
<li><strong>Guidance scale → very high.</strong> The initial search range was 0–2; the top arm always pinned, so the range was shifted upward repeatedly until it settled around <strong>7–9</strong>. Strong evidence the advantage conditioning is carrying real signal — a policy conditioned on &quot;predict good actions&quot; behaves <em>substantially</em> differently from its unconditional self, and pushing hard along that direction keeps helping.</li>
<li><strong>Candidates <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>N</mi><mo>&gt;</mo><mn>1</mn></mrow><annotation encoding="application/x-tex">N &gt; 1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7224em;vertical-align:-0.0391em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">N</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">&gt;</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span> helps, <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>N</mi><mo>&gt;</mo><mn>3</mn></mrow><annotation encoding="application/x-tex">N &gt; 3</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7224em;vertical-align:-0.0391em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">N</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">&gt;</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">3</span></span></span></span> does not</strong> — consistent with best-of-N mostly <em>avoiding very bad chunks</em> rather than finding an optimal one.</li>
<li><strong>Execution length → small.</strong> The model predicts the nearest steps far more reliably than the far ones, so frequent re-planning against a fresh observation pays off.</li>
<li><strong>Playback stretch → eventually matched execution length.</strong> Early in training the model does not predict the optimal velocity, so exploring around the predicted speed helps; by the end it predicts the right velocity directly.</li>
<li><strong>Inpainting → light anchoring.</strong> A little beats none, but strong forced inpainting limits the model's ability to self-correct.</li>
</ul>
</div>
<div class="tiny">Caveat on reading the posteriors: rewards are baseline-subtracted, so all means sit near 0.5 and only their relative order matters; and posteriors decay each iteration, so they reflect the recent on-policy window rather than the whole run.</div>
</section>

<p>The win was <strong>broad</strong> — top score outright on three of four garment types, third on long tops.</p>
<p><strong>Scale:</strong> ~12,500 rollout episodes (~4.3M frames) across ~140 sessions, single H200, batch 192, ~300k steps. Rollouts on RTX PRO 6000.</p>
<p><strong>Remaining failures:</strong> (a) <em>dexterity</em> — the fold looks almost right but a keypoint lands just the wrong side of its threshold; (b) <em>simulator physics</em> — occasional unfair grasp failures; (c) <strong>no recovery</strong> — once in an OOD state the policy fails outright rather than working back.</p>
<div class="box warn">
The author's own verdict: <b>"I would not call this approach sample-efficient."</b> Prime suspect: no recovery logic, and a scripted BC dataset with almost no exploration or diversity to bootstrap from.
</div>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="45" style="--paginate:true;--theme:default;" data-marpit-pagination-total="54">
<h2 id="sim-to-real--one-week-and-most-of-the-rl-comes-off">Sim-to-real — one week, and most of the RL comes off</h2>
<p><strong>Zero-shot failed.</strong> The clearest diagnosis: resizing 640×480 → 224×224 <em>directly</em> vs. via 320×240 — invisible to a human — dropped sim success significantly, and the auxiliary heads could <strong>perfectly distinguish</strong> the two. The policy had overfit to rendering artifacts.</p>
<div class="cols">
<div>
<p><strong>What was kept:</strong> action objective, garment-type head, completion head.<br />
<strong>Frozen:</strong> success, checkpoint, TTC heads.<br />
<strong>Removed entirely:</strong> keypoint-distance head, both world-model heads — all need privileged sim targets.<br />
<strong>Removed from the pipeline:</strong> advantage conditioning, the AdaRMS advantage channel, and therefore <strong>CFG and best-of-N</strong>.</p>
<div class="box warn">
So the real-robot policy ran as <b>essentially plain BC</b> — a denoised chunk, soft inpainting, garment-type bootstrap. Nothing else.
</div>
</div>
<div>
<p><strong>Two levers:</strong> make the environments more similar, or make the training distribution diverse enough that the gap falls inside it. He used both.</p>
<ul>
<li><strong>Alignment:</strong> a camera-overlay tool — drive the robot to a recorded joint state, overlay live cameras on the dataset frame. Shared with organizers and other teams.</li>
<li><strong>Diversity:</strong> very aggressive augmentation (per-camera color jitter, gain/gamma, blur, noise, independent crop/rotate/zoom, cutout, <strong>camera dropout</strong>, state noise/dropout) — <em>plus deliberately randomizing his own rig</em> over the week.</li>
<li><strong>Motion-intensity alignment:</strong> each source is time-resampled to a common speed (organizer BC ×1.0, home teleop ×1.5, sim ×0.65, DAgger ×2.0) so &quot;how far to move in one step&quot; stays consistent.</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="46" style="--paginate:true;--theme:default;" data-marpit-pagination-total="54">
<h2 id="real-dagger-and-a-crude-stand-in-for-advantage">Real DAgger, and a crude stand-in for advantage</h2>
<p>Recovery data is the one thing the organizer BC set cannot provide — it only ever shows clean successful folds. So: policy folds autonomously, human takes over the moment it starts to fail, corrects, hands back. Every frame labeled by who was driving.</p>
<div class="box">
<p>With no reward or value function on the real robot, advantages are unavailable. But <strong>the intervention signal is itself informative</strong> — a takeover marks a recent policy failure, and the human's correction is by construction a high-advantage action. Turned into per-frame sampling weights:</p>
<ul>
<li><strong>Human-correction frames</strong> → highest weight.</li>
<li><strong>Autonomous frames far from any intervention</strong> → low weight (the policy was doing fine; little new signal).</li>
<li><strong>Autonomous frames in the 5 s window before a takeover</strong> → <strong>ramped to zero.</strong> Do not reinforce the moves that led into the bad state.</li>
</ul>
</div>
<p><strong>Result: 2nd place, 865 vs 895 points</strong> (composite jury metric; unseen garments carried a 50% bonus; max 1080).</p>
<p><strong>Training mix:</strong> organizer BC 60% (500 eps — closest to the eval distribution), own teleop+DAgger 30% (792 eps — mismatched rig, but the only source of recovery), sim success-replays 10% (1,723 eps — regularizer).</p>
<div class="box warn">
<b>The units bug.</b> Between two LeRobot 0.4.x releases the SO-101 state representation changed from normalized −100…100 to degrees. Visually near-identical, but skews every joint ~10%. Most of the real data and training ran on the wrong convention until <b>two days before the deadline</b>.
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="47" style="--paginate:true;--theme:default;" data-marpit-pagination-total="54">
<h2 id="what-the-author-would-keep--and-the-open-problem">What the author would keep — and the open problem</h2>
<div class="cols">
<div>
<p><strong>Keep</strong></p>
<ul>
<li><strong>Policy as its own value function</strong> — no separate critic to train, sync, or serve; one forward pass yields everything.</li>
<li><strong>Reward engineering</strong> — the building blocks (ground-truth checkpoints, success probability, completion, relative success) are right even if his mix is not optimal.</li>
<li><strong>Throughput engineering</strong> — data collection is a numbers game.</li>
<li><strong>Inference-time tuning</strong> — a big win at zero training cost.</li>
<li><strong>DAgger over full teleop</strong> — keep interventions short.</li>
</ul>
</div>
<div>
<p><strong>Didn't work / was hard</strong></p>
<ul>
<li>Recovery in <strong>sim</strong> — teleoperating cloth through a sim interface is hard, and the policy soon folded better than he could.</li>
<li>Overfitting to rendering artifacts.</li>
<li>The model is <strong>bigger than the task needs</strong>.</li>
</ul>
<div class="box warn">
<b>Biggest regret:</b> two rounds solved with two separate toolkits. Sim had the full RL machinery but no recovery; real had human interventions that <i>did</i> produce recovery but ran as plain BC. <b>Fusing them</b> — a real-side value function driving advantage conditioning, best-of-N, and DAgger weighting on the real robot — is where he'd put the next effort. His guess: 90%+ on this task.
</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="48" style="--paginate:true;--theme:default;" data-marpit-pagination-total="54">
<h2 id="the-open-problem-exploration-and-recovery">The open problem: exploration and recovery</h2>
<div class="box warn">
<blockquote>
<p>&quot;The proposed RL approach is great at reproducing and sharpening behavior it has seen, but it doesn't naturally explore its way out of states off the training distribution.&quot;</p>
</blockquote>
</div>
<p>Notice that <strong>every inference-time trick pushes toward known-good modes, not new ones:</strong></p>
<table>
<thead>
<tr>
<th>Mechanism</th>
<th>What it does</th>
</tr>
</thead>
<tbody>
<tr>
<td>Advantage conditioning + CFG</td>
<td>amplifies the <em>average good</em> behavior already in the data</td>
</tr>
<tr>
<td>Best-of-N</td>
<td>picks the least-bad of several samples <strong>from the same prefix</strong></td>
</tr>
<tr>
<td>Soft inpainting</td>
<td>keeps the policy in the mode it already committed to</td>
</tr>
</tbody>
</table>
<p><strong>None of them invent a recovery move that isn't already in the data.</strong> Attempts at explicit exploration mostly pushed the chunk off the action manifold and degraded performance — exactly the failure mode predicted in Part 3.</p>
<p>The only reliable source of recovery was <strong>human intervention</strong> — which worked on the real robot but not in sim. This is the same limitation π*₀.₆ names (&quot;exploration is largely greedy&quot;). It is the shared blind spot of the whole conditioning/reweighting family.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-class="lead" data-theme="default" lang="C" class="lead" data-marpit-pagination="49" style="--paginate:true;--class:lead;--theme:default;" data-marpit-pagination-total="54">
<h1 id="synthesis">Synthesis</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="50" style="--paginate:true;--theme:default;" data-marpit-pagination-total="54">

<div class="small">
<table>
<thead>

<td><strong>Validation</strong></td>

<td>real tasks, controlled comparisons</td>

<div class="box good">
<b>The through-line:</b> stay on the data manifold, use a KL-style trust region to stay near the behavior policy, and turn RL into supervised learning. What changes across six years is <i>how</i> the advantage gets into the objective — and each change is forced by the policy class getting more expressive.
</div>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="51" style="--paginate:true;--theme:default;" data-marpit-pagination-total="54">
<h2 id="discussion-points">Discussion points</h2>
<p><strong>1. Weighting vs. conditioning.</strong> RECAP's own comparison says conditioning ≫ AWR for <em>throughput</em>, because AWR filters away the data that teaches speed. Learning to Fold says use both. Are these in tension, or does moving AWR into the <em>sampler</em> (with importance-weight debiasing for the aux heads) change the calculus?</p>
<p><strong>2. Is a separate critic worth it?</strong> π*₀.₆ trains a 670M value model; Learning to Fold makes it a linear probe on the policy. The latter is cheaper and shares representation — but the author lists &quot;the value head drifts because the same network predicts actions&quot; as a known weakness, and works around it with EMA smoothing, tail correction, and stale-data blending.</p>
<p><strong>3. Sparse-and-universal vs. dense-and-engineered rewards.</strong> π*₀.₆ deliberately uses one sparse reward that applies to <em>any</em> task. Learning to Fold hand-engineers dense checkpoints from the success checker — and calls reward design &quot;still an art&quot;. Which generalizes?</p>
<p><strong>4. The shared blind spot.</strong> Both papers admit exploration is greedy and recovery comes from humans. Everything in this lineage sharpens known-good behavior. <strong>What would it take to get a flow-matching policy to invent a recovery move that is not in its data?</strong></p>
</section>
